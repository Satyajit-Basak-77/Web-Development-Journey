<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbr tag example</title>
</head>
<body>
    <!-- Syntax -->
<p>
<abbr title="The text which was shown after cursor hovering">The text which was shown as normal text but DOTTED UNDERLINE</abbr>
<br>
but only have to hover over the text only with the text which has
<abbr title="Yes you got it?">dotted underline</abbr>
-- like this.
</p>
    <!-- Example -->
<p>
    A Football Player: 
    <abbr title="The GOAT">Messi</abbr>
</p>
</body>
</html>
