<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag with more Attributes</title>
</head>
<body>
    <p>
        If you want to open Google in same tab click
        <a href="https://www.google.com/">here</a>
        <br>
        If you want to open Google in different tab click
        <a href="https://www.google.com/" target="_main">here</a>
        <!-- target attribute helping the link to open in a new tab -->

        <!-- Clickable image -->
        If you want to open youtube just by clicking in the logo <br>
        <a href="https://www.youtube.com/" target= "_main"> <img src="https://static.vecteezy.com/system/resources/thumbnails/042/127/234/small/white-square-bordered-youtube-logo-on-transparent-background-free-png.png" height= "50" width = "100" alt="Youtube Logo"></a>
    </p>
</body>
</html>
