<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <header> 
        <h3> Unordered List </h3> 
    </header>
    <main>
        <!-- Unordered List is declared by ul tag and for each element we need to use li tag to make the element part of the list-->
        <ul type="square"> 
            <!-- Square bullet points -->
            <li>Google</li>
                <ul>
                    made by google
                </ul>
            <li>Brave</li>
            <li>Edge</li>
            <li>Opera</li>
            <li>Firefox</li>
        </ul>
        <hr>
        <!-- Ordered List is declared by ol tag and for each element we need to use li tag to make the element part of the list but instead of bullets here we get an automatic numbering-->
        <!-- By default the numbering will start from 1 -->
        <ol type="i" start="5" reversed>
            <li>Maida 1kg</li>
            <li>Chini 1/2 kg</li>
            <li>Jilipi</li>
            <li>Dhone Pata</li>
            <li>Biscute</li>
            <li>Badam 500 gm</li>
            <li>Jol 2 dram</li>
        </ol>
    </main>
</body>
</html>
