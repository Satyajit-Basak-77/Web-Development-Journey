<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superscript and Subscript Tags</title>
</head>
<body>
    <p> 
        <!-- Superscript -->
        This is a normal formula: (a+b)2 = a2 + 2ab + b2
        <br>
        This is correct: (a+b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>

        <!-- Subscript -->
        <p>
        This is the wrong way of writing: H2O
        <br>
        This is the correct way: H<sub>2</sub>O (Water)
        <br>
        Ethyl Alcohol: CH<sub>3</sub>CH<sub>2</sub>OH or C<sub>2</sub>H<sub>5</sub>OH
        </p>
    </p>
</body>
</html>
